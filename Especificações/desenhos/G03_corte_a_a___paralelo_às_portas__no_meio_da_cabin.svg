<text x="190.00" y="26.00" font-size="3.0" text-anchor="start" fill="#222" font-weight="bold">Leitura do corte</text>
<text x="190.00" y="32.00" font-size="2.4" text-anchor="start" fill="#222">Marrom claro: compensado naval 18 mm cortado pelo plano.</text>
<text x="190.00" y="36.30" font-size="2.4" text-anchor="start" fill="#222">Marrom com X: sarrafo 40 × 40 ou longarina 45 × 70.</text>
<text x="190.00" y="40.60" font-size="2.4" text-anchor="start" fill="#222">Amarelo hachurado: lã de rocha 50 mm + tela.</text>
<text x="190.00" y="44.90" font-size="2.4" text-anchor="start" fill="#222">Tracejado vermelho: envelope do gerador (820 × 680 × 650).</text>
<text x="190.00" y="49.20" font-size="2.4" text-anchor="start" fill="#222"></text>
<text x="190.00" y="53.50" font-size="2.4" text-anchor="start" fill="#222">Cotas acumuladas. Horizontais: a partir da face externa</text>
<text x="190.00" y="57.80" font-size="2.4" text-anchor="start" fill="#222">do lado do escapamento (direita do desenho).</text>
<text x="190.00" y="62.10" font-size="2.4" text-anchor="start" fill="#222">Verticais: a partir do chão.</text>
<text x="190.00" y="66.40" font-size="2.4" text-anchor="start" fill="#222"></text>
<text x="190.00" y="70.70" font-size="2.4" text-anchor="start" fill="#222">Divisória: topo a 1500; passagem de ar de</text>
<text x="190.00" y="75.00" font-size="2.4" text-anchor="start" fill="#222">214 até o revestimento do teto.</text>
<text x="190.00" y="79.30" font-size="2.4" text-anchor="start" fill="#222">Duto de entrada: 246 livres entre revestimentos.</text>
<text x="190.00" y="83.60" font-size="2.4" text-anchor="start" fill="#222">Chicana 1: desce da tampa até 1920.</text>
<text x="190.00" y="87.90" font-size="2.4" text-anchor="start" fill="#222">Chicana 2: sobe do piso do capuz até 1980.</text>
<text x="190.00" y="92.20" font-size="2.4" text-anchor="start" fill="#222">Emenda da traseira a 1658 do chão.</text>
<text x="190.00" y="96.50" font-size="2.4" text-anchor="start" fill="#222">Exaustores Ø300 sobre o teto, centro a 850 do lado</text>
<text x="190.00" y="100.80" font-size="2.4" text-anchor="start" fill="#222">do escapamento.</text>
<text x="9.00" y="200.50" font-size="3.6" text-anchor="start" fill="#222" font-weight="bold">G03 — Corte A-A — paralelo às portas, no meio da cabine</text>
<text x="288.00" y="198.50" font-size="2.4" text-anchor="end" fill="#222">Cabine acústica ventilada para gerador</text>
<text x="288.00" y="201.80" font-size="2.2" text-anchor="end" fill="#444">Medidas em mm · não medir no desenho, usar as cotas · folha 3/28</text>
<text x="9.00" y="203.10" font-size="2" text-anchor="start" fill="#222"></text>
<text x="156.50" y="200.50" font-size="2.4" text-anchor="middle" fill="#444">plano a 800 da traseira, visto da frente</text>
</svg>